[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megalodonte-cli"
version = "0.1.0"
description = "Create Megalodonte desktop applications with native or JSONC views"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
megalodonte = "megalodonte_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
megalodonte_cli = ["assets/**/*", "assets/*"]

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">Como funciona o live reload do Megalodonte</title><desc id="desc">Mudanças no projeto passam por detecção, World, compilação incremental e validação antes de chegarem a todas as janelas gerenciadas do aplicativo cliente.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#14213a"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="8" flood-opacity=".35"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#94a3b8"/></marker><style>text{font-family:Inter,'DejaVu Sans',sans-serif}.h{fill:#f8fafc;font-size:34px;font-weight:700}.sub{fill:#94a3b8;font-size:16px}.t{fill:#f8fafc;font-size:20px;font-weight:700}.b{fill:#cbd5e1;font-size:14px}.sm{fill:#94a3b8;font-size:12px}.n{fill:#07111f;font-size:13px;font-weight:800}.card{fill:#152238;stroke-width:2}.line{fill:none;stroke:#94a3b8;stroke-width:2.5;marker-end:url(#a)}.pill{fill:#24344e}.warn{fill:#3b2a12;stroke:#fbbf24;stroke-width:2}.bad{fill:#3c1923;stroke:#fb7185;stroke-width:2}</style></defs>
<rect width="1440" height="940" rx="24" fill="url(#bg)"/><text x="52" y="58" class="h">Live reload Megalodonte: do código salvo a todas as janelas</text><text x="52" y="88" class="sub">O aplicativo cliente só muda depois que uma geração isolada compila e é validada com sucesso.</text>
<g filter="url(#s)"><rect x="52" y="145" width="220" height="190" rx="18" class="card" stroke="#38bdf8"/><circle cx="82" cy="177" r="17" fill="#38bdf8"/><text x="78" y="182" class="n">1</text><text x="110" y="184" class="t">Projeto cliente</text><text x="76" y="224" class="b">Você salva Java, resources</text><text x="76" y="248" class="b">ou configuração do build.</text><rect x="76" y="276" width="170" height="36" rx="9" class="pill"/><text x="92" y="299" class="b">megalodonte dev</text></g>
<g filter="url(#s)"><rect x="322" y="145" width="220" height="190" rx="18" class="card" stroke="#a78bfa"/><circle cx="352" cy="177" r="17" fill="#a78bfa"/><text x="348" y="182" class="n">2</text><text x="380" y="184" class="t">Detecção</text><text x="346" y="224" class="b">Caminho + hash + tokens Java</text><text x="346" y="260" class="sm">Primeira vez: manifesto completo</text><text x="346" y="284" class="sm">Depois: adicionado/alterado/removido</text></g>
<g filter="url(#s)"><rect x="592" y="125" width="250" height="230" rx="18" class="card" stroke="#22d3ee"/><circle cx="622" cy="157" r="17" fill="#22d3ee"/><text x="618" y="162" class="n">3</text><text x="650" y="164" class="t">World</text><text x="616" y="205" class="b">Espelho isolado do projeto</text><rect x="616" y="230" width="202" height="34" rx="9" class="pill"/><text x="630" y="252" class="sm">Manifesto JSON + deltas</text><rect x="616" y="274" width="202" height="34" rx="9" class="pill"/><text x="630" y="296" class="sm">Blobs de conteúdo SHA-256</text><text x="616" y="332" class="sm">Valores do .env nunca entram</text></g>
<g filter="url(#s)"><rect x="892" y="145" width="220" height="190" rx="18" class="card" stroke="#f59e0b"/><circle cx="922" cy="177" r="17" fill="#f59e0b"/><text x="918" y="182" class="n">4</text><text x="950" y="184" class="t">Compilação</text><text x="916" y="224" class="b">Gradle + javac recompilam</text><text x="916" y="248" class="b">unidades/dependentes afetados.</text><text x="916" y="284" class="sm">Classes + resources privados</text></g>
<g filter="url(#s)"><rect x="1162" y="145" width="226" height="190" rx="18" class="card" stroke="#34d399"/><circle cx="1192" cy="177" r="17" fill="#34d399"/><text x="1188" y="182" class="n">5</text><text x="1220" y="184" class="t">Validação</text><text x="1186" y="224" class="b">Congela a geração e verifica</text><text x="1186" y="248" class="b">compatibilidade das classes.</text><text x="1186" y="284" class="sm">Nada é aplicado antes disso</text></g>
<path d="M272 240h46M542 240h46M842 240h46M1112 240h46" class="line"/><path d="M1275 335v70H1030" class="line"/><text x="1045" y="388" class="sm">COMPILATION_RESULT retorna ao cliente</text>
<g filter="url(#s)"><rect x="388" y="410" width="1000" height="220" rx="22" class="card" stroke="#60a5fa"/><circle cx="422" cy="445" r="18" fill="#60a5fa"/><text x="418" y="450" class="n">6</text><text x="454" y="452" class="t">Aplicativo cliente — recebe metadados e artefatos alterados</text><text x="422" y="484" class="b">status + diagnósticos + artifactDelta: caminhos alterados/removidos, SHA-256 e tamanho. O projeto inteiro não volta.</text><rect x="422" y="512" width="218" height="82" rx="12" class="pill"/><text x="438" y="538" class="t">1. Transferência</text><text x="438" y="562" class="sm">somente bytes de classes</text><text x="438" y="580" class="sm">e resources alterados</text><rect x="656" y="512" width="218" height="82" rx="12" class="pill"/><text x="672" y="538" class="t">2. Agente Java</text><text x="672" y="562" class="sm">redefineClasses no mesmo</text><text x="672" y="580" class="sm">processo da JVM</text><rect x="890" y="512" width="218" height="82" rx="12" class="pill"/><text x="906" y="538" class="t">3. Thread JavaFX</text><text x="906" y="562" class="sm">renderiza as telas existentes</text><text x="906" y="580" class="sm">preservando o State</text><rect x="1124" y="512" width="230" height="82" rx="12" class="pill"/><text x="1140" y="538" class="t">4. Troca atômica</text><text x="1140" y="562" class="sm">Scene.setRoot na principal +</text><text x="1140" y="580" class="sm">secundárias registradas</text></g>
<text x="52" y="452" class="t">O que continua vivo?</text><text x="52" y="492" class="b">• Processo do aplicativo</text><text x="52" y="520" class="b">• Todos os Stage + Scene</text><text x="52" y="548" class="b">• Telas + State</text><text x="52" y="576" class="b">• Código anterior em falhas</text>
<text x="52" y="690" class="t">Resultados seguros quando o caminho principal não pode ser usado</text>
<g filter="url(#s)"><rect x="52" y="720" width="412" height="150" rx="18" class="bad"/><text x="78" y="758" class="t">Falha ao compilar ou renderizar</text><text x="78" y="796" class="b">A geração candidata é rejeitada. O aplicativo</text><text x="78" y="820" class="b">continua na última versão funcional.</text><text x="78" y="850" class="sm">REJECTED — corrija e salve novamente</text></g>
<g filter="url(#s)"><rect x="514" y="720" width="412" height="150" rx="18" class="warn"/><text x="540" y="758" class="t">Estrutura ou dependência mudou</text><text x="540" y="796" class="b">A JVM padrão não consegue aplicar com segurança.</text><text x="540" y="820" class="b">O aplicativo atual fica aberto até reiniciar.</text><text x="540" y="850" class="sm">RESTART_REQUIRED</text></g>
<g filter="url(#s)"><rect x="976" y="720" width="412" height="150" rx="18" class="warn"/><text x="1002" y="758" class="t">O .env mudou</text><text x="1002" y="796" class="b">Somente caminho, tamanho e hash são observados.</text><text x="1002" y="820" class="b">Segredos ficam privados; é necessário reiniciar.</text><text x="1002" y="850" class="sm">RESTART_REQUIRED</text></g>
<text x="52" y="915" class="sm">Tokens melhoram a detecção. Gradle compila unidades e a JVM ativa classes; campos isolados nunca são compilados nem copiados como blocos de memória.</text>
</svg>

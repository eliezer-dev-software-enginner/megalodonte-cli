<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Megalodonte incremental live reload</title>
  <desc id="desc">Flow from a real Java project through a JSON delta map, content-addressed virtual world, incremental Gradle compilation and safe runtime activation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#94a3b8"/></marker>
    <style>
      text{font-family:Inter,DejaVu Sans,sans-serif}.h{font-size:27px;font-weight:700;fill:#f8fafc}.s{font-size:15px;fill:#94a3b8}.t{font-size:18px;font-weight:700;fill:#f8fafc}.b{font-size:14px;fill:#cbd5e1}.tag{font-size:12px;font-weight:700}.box{fill:#172033;stroke-width:2}.line{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="820" rx="22" fill="url(#bg)"/>
  <text x="42" y="50" class="h">Megalodonte live reload: incremental compilation world</text>
  <text x="42" y="78" class="s">Token-level detection • source-unit compilation • class-level activation</text>

  <rect class="box" x="42" y="120" width="250" height="126" rx="14" stroke="#38bdf8"/>
  <text x="62" y="153" class="t">1. Real project</text><text x="62" y="181" class="b">Java sources + build files</text><text x="62" y="204" class="b">resources + dependency metadata</text><text x="62" y="227" class="b">.env: hash only, never contents</text>
  <rect class="box" x="345" y="120" width="305" height="126" rx="14" stroke="#a78bfa"/>
  <text x="365" y="153" class="t">2. Project mapper</text><text x="365" y="181" class="b">First: complete JSON manifest</text><text x="365" y="204" class="b">Next: added / changed / deleted</text><text x="365" y="227" class="b">Token hashes, types and imports</text>
  <rect class="box" x="703" y="120" width="455" height="126" rx="14" stroke="#22d3ee"/>
  <text x="723" y="153" class="t">3. Content-addressed virtual world</text><text x="723" y="181" class="b">SHA-256 blobs preserve equal-file timestamps</text><text x="723" y="204" class="b">Sources/resources are mirrored; no Base64 payload</text><text x="723" y="227" class="b">Build outputs stay outside the real project</text>
  <path class="line" d="M292 183H342"/><path class="line" d="M650 183H700"/>

  <rect class="box" x="42" y="315" width="420" height="132" rx="14" stroke="#34d399"/>
  <text x="62" y="348" class="t">4. Gradle daemon + javac</text><text x="62" y="376" class="b">Reads the mirrored inputs</text><text x="62" y="399" class="b">Compiles changed source units and affected dependents</text><text x="62" y="422" class="b">A token is diagnostic; a class file is the loadable unit</text>
  <rect class="box" x="520" y="315" width="300" height="132" rx="14" stroke="#fbbf24"/>
  <text x="540" y="348" class="t">5. JSON result</text><text x="540" y="376" class="b">Status + diagnostics</text><text x="540" y="399" class="b">Artifact paths, sizes and hashes</text><text x="540" y="422" class="b">No full application returned</text>
  <rect class="box" x="878" y="315" width="280" height="132" rx="14" stroke="#60a5fa"/>
  <text x="898" y="348" class="t">6. Frozen generation</text><text x="898" y="376" class="b">Classes + processed resources</text><text x="898" y="399" class="b">Failed builds never replace it</text><text x="898" y="422" class="b">Dependencies are fingerprinted</text>
  <path class="line" d="M930 246V278H252V312"/><path class="line" d="M462 381H517"/><path class="line" d="M820 381H875"/>

  <rect class="box" x="42" y="528" width="1116" height="216" rx="14" stroke="#64748b"/>
  <text x="62" y="565" class="t">7. Runtime activation decision</text>
  <rect x="67" y="595" width="315" height="112" rx="12" fill="#102a25" stroke="#34d399"/>
  <text x="87" y="627" class="t">Compatible method change</text><text x="87" y="655" class="b">Redefine classes in one transaction</text><text x="87" y="678" class="b">Rerender while keeping Stage / Scene / State</text>
  <rect x="443" y="595" width="315" height="112" rx="12" fill="#302711" stroke="#fbbf24"/>
  <text x="463" y="627" class="t">Class shape / dependency</text><text x="463" y="655" class="b">Standard JVM requires replacement</text><text x="463" y="678" class="b">Old version remains unless restart is opted in</text>
  <rect x="819" y="595" width="315" height="112" rx="12" fill="#321923" stroke="#fb7185"/>
  <text x="839" y="627" class="t">.env changed</text><text x="839" y="655" class="b">RESTART_REQUIRED</text><text x="839" y="678" class="b">Configuration is reread at bootstrap</text>
  <path class="line" d="M1018 447V485H600V525"/>
  <text x="42" y="785" class="s">Structural hot replacement with the same native windows remains a separate activation problem; tokenization reduces compilation work but does not bypass JVM rules.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Live reload incremental do Megalodonte</title>
  <desc id="desc">Fluxo do projeto Java real pelo mapa de deltas JSON, mundo virtual por conteúdo, compilação incremental Gradle e ativação segura.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#94a3b8"/></marker><style>text{font-family:Inter,DejaVu Sans,sans-serif}.h{font-size:27px;font-weight:700;fill:#f8fafc}.s{font-size:15px;fill:#94a3b8}.t{font-size:18px;font-weight:700;fill:#f8fafc}.b{font-size:14px;fill:#cbd5e1}.box{fill:#172033;stroke-width:2}.line{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="820" rx="22" fill="url(#bg)"/><text x="42" y="50" class="h">Live reload Megalodonte: mundo de compilação incremental</text><text x="42" y="78" class="s">Detecção por tokens • compilação por fontes • ativação por classes</text>
  <rect class="box" x="42" y="120" width="250" height="126" rx="14" stroke="#38bdf8"/><text x="62" y="153" class="t">1. Projeto real</text><text x="62" y="181" class="b">Fontes Java + arquivos de build</text><text x="62" y="204" class="b">resources + dependências</text><text x="62" y="227" class="b">.env: apenas hash, nunca valores</text>
  <rect class="box" x="345" y="120" width="305" height="126" rx="14" stroke="#a78bfa"/><text x="365" y="153" class="t">2. Mapeador do projeto</text><text x="365" y="181" class="b">Primeiro: manifesto JSON completo</text><text x="365" y="204" class="b">Depois: adicionados / alterados / removidos</text><text x="365" y="227" class="b">Hashes de tokens, tipos e imports</text>
  <rect class="box" x="703" y="120" width="455" height="126" rx="14" stroke="#22d3ee"/><text x="723" y="153" class="t">3. Mundo virtual por conteúdo</text><text x="723" y="181" class="b">Blobs SHA-256 preservam datas de arquivos iguais</text><text x="723" y="204" class="b">Fontes/resources espelhados; sem Base64 no JSON</text><text x="723" y="227" class="b">Saídas ficam fora do projeto real</text><path class="line" d="M292 183H342"/><path class="line" d="M650 183H700"/>
  <rect class="box" x="42" y="315" width="420" height="132" rx="14" stroke="#34d399"/><text x="62" y="348" class="t">4. Gradle daemon + javac</text><text x="62" y="376" class="b">Lê as entradas espelhadas</text><text x="62" y="399" class="b">Compila fontes alteradas e dependentes afetados</text><text x="62" y="422" class="b">Token diagnostica; classe é a unidade carregável</text>
  <rect class="box" x="520" y="315" width="300" height="132" rx="14" stroke="#fbbf24"/><text x="540" y="348" class="t">5. Resultado JSON</text><text x="540" y="376" class="b">Status + diagnósticos</text><text x="540" y="399" class="b">Caminhos, tamanhos e hashes</text><text x="540" y="422" class="b">Não devolve a aplicação inteira</text>
  <rect class="box" x="878" y="315" width="280" height="132" rx="14" stroke="#60a5fa"/><text x="898" y="348" class="t">6. Geração congelada</text><text x="898" y="376" class="b">Classes + resources processados</text><text x="898" y="399" class="b">Build falho nunca a substitui</text><text x="898" y="422" class="b">Dependências possuem fingerprint</text><path class="line" d="M930 246V278H252V312"/><path class="line" d="M462 381H517"/><path class="line" d="M820 381H875"/>
  <rect class="box" x="42" y="528" width="1116" height="216" rx="14" stroke="#64748b"/><text x="62" y="565" class="t">7. Decisão de ativação no runtime</text>
  <rect x="67" y="595" width="315" height="112" rx="12" fill="#102a25" stroke="#34d399"/><text x="87" y="627" class="t">Método compatível</text><text x="87" y="655" class="b">Redefine classes em uma transação</text><text x="87" y="678" class="b">Rerenderiza mantendo Stage / Scene / State</text>
  <rect x="443" y="595" width="315" height="112" rx="12" fill="#302711" stroke="#fbbf24"/><text x="463" y="627" class="t">Estrutura / dependência</text><text x="463" y="655" class="b">JVM padrão exige substituição</text><text x="463" y="678" class="b">Versão antiga fica até reinício autorizado</text>
  <rect x="819" y="595" width="315" height="112" rx="12" fill="#321923" stroke="#fb7185"/><text x="839" y="627" class="t">.env alterado</text><text x="839" y="655" class="b">RESTART_REQUIRED</text><text x="839" y="678" class="b">Configuração é relida no bootstrap</text><path class="line" d="M1018 447V485H600V525"/>
  <text x="42" y="785" class="s">Troca estrutural mantendo janelas é outro problema de ativação; tokenizar reduz compilação, mas não remove as regras da JVM.</text>
</svg>
